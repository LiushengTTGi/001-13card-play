name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - windows-amd64
          - windows-arm64
          - linux-amd64
          - linux-arm64
          - darwin-amd64
          - darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        run: bash build.sh "$TARGET"

      - uses: actions/upload-artifact@v4
        with:
          name: kuaile13-${{ matrix.target }}
          path: bin/kuaile13-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kuaile13-*
          merge-multiple: true
          path: dist

      - name: checksums
        run: (cd dist && sha256sum kuaile13-* > SHA256SUMS)

      - name: publish
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "开心十三张 $GITHUB_REF_NAME" \
            --generate-notes
